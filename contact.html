<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Habbda ever - Contact</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>Please fill out the form below to get in touch with us.</p>

            <form action="#" method="post">
                <!-- Text Input -->
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <!-- Email Input -->
                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>

                <!-- Number Input -->
                <div>
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 20">
                </div>

                <!-- Date Input -->
                <div>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <!-- Dropdown Menu (Select) -->
                <div>
                    <label for="subject">Topic / Department:</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>-- Select a topic --</option>
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>

                <!-- Radio Buttons -->
                <fieldset>
                    <legend>Preferred Contact Method:</legend>
                    <label>
                        <input type="radio" name="contact_method" value="email" checked> Email
                    </label>
                    <label>
                        <input type="radio" name="contact_method" value="phone"> Phone Call
                    </label>
                </fieldset>

                <!-- Checkboxes -->
                <fieldset>
                    <legend>Topics of Interest:</legend>
                    <label>
                        <input type="checkbox" name="interests" value="html-css"> HTML & CSS
                    </label>
                    <label>
                        <input type="checkbox" name="interests" value="javascript"> JavaScript
                    </label>
                    <label>
                        <input type="checkbox" name="interests" value="newsletter"> Subscribe to Newsletter
                    </label>
                </fieldset>

                <!-- Large Text Box (Textarea) -->
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="Type your message here..." required></textarea>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>
</body>
</html>
