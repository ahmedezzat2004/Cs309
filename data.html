<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Data Table</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
        <h1>My Blog</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="validation.html">Registration</a>
            <a href="data.html" aria-current="page">Data Table</a>
        </nav>
    </header>
    <main id="main-content" tabindex="-1">
        <section class="surface">
            <h2>People</h2>
            <p>Search the list or sort it by name or age.</p>
            <div class="table-controls">
                <div class="form-field">
                    <label for="search">Search people:</label>
                    <input type="search" id="search" placeholder="Type a name, age, or city">
                </div>
                <div class="form-field">
                    <span class="control-label" id="sort-label">Sort the table:</span>
                    <div class="table-actions" role="group" aria-labelledby="sort-label">
                        <button type="button" id="sort-name" aria-label="Sort by name">Sort by name</button>
                        <button type="button" id="sort-age" aria-label="Sort by age">Sort by age</button>
                    </div>
                </div>
            </div>
            <p id="table-status" class="table-status" role="status" aria-live="polite"></p>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Age</th>
                            <th scope="col">City</th>
                        </tr>
                    </thead>
                    <tbody id="people-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>
    <script>
        const people = [
            { name: "Ahmed", age: 21, city: "Cairo" },
            { name: "Mariam", age: 24, city: "Alexandria" },
            { name: "Omar", age: 19, city: "Giza" },
            { name: "Nour", age: 22, city: "Mansoura" },
            { name: "Youssef", age: 26, city: "Cairo" }
        ];
        const searchInput = document.querySelector("#search");
        const tableBody = document.querySelector("#people-table-body");
        const tableStatus = document.querySelector("#table-status");
        let sortKey = "";
        let sortAscending = true;

        function renderTable() {
            const query = searchInput.value.trim().toLowerCase();
            const filteredPeople = people.filter((person) =>
                Object.values(person).some((value) => String(value).toLowerCase().includes(query))
            );

            if (sortKey) {
                filteredPeople.sort((first, second) => {
                    const comparison = typeof first[sortKey] === "string"
                        ? first[sortKey].localeCompare(second[sortKey])
                        : first[sortKey] - second[sortKey];
                    return sortAscending ? comparison : -comparison;
                });
            }

            tableBody.replaceChildren();
            filteredPeople.forEach((person) => {
                const row = document.createElement("tr");
                [person.name, person.age, person.city].forEach((value) => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.append(cell);
                });
                tableBody.append(row);
            });

            tableStatus.textContent = filteredPeople.length
                ? `Showing ${filteredPeople.length} of ${people.length} people.`
                : "No people match your search.";
        }

        function sortBy(key) {
            sortAscending = sortKey === key ? !sortAscending : true;
            sortKey = key;
            renderTable();
        }

        searchInput.addEventListener("input", renderTable);
        document.querySelector("#sort-name").addEventListener("click", () => sortBy("name"));
        document.querySelector("#sort-age").addEventListener("click", () => sortBy("age"));
        renderTable();
    </script>
</body>
</html>
