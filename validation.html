<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Registration</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
        <h1>My Blog</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="validation.html" aria-current="page">Registration</a>
            <a href="data.html">Data Table</a>
        </nav>
    </header>
    <main id="main-content" tabindex="-1">
        <section class="surface">
            <h2>Registration Form</h2>
            <p>Complete all fields. This demo checks your information in your browser and does not send or store it.</p>
            <form id="registration-form" novalidate>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-error">
                        <span class="field-error" id="name-error"></span>
                    </div>
                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
                        <span class="field-error" id="email-error"></span>
                    </div>
                    <div class="form-field">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="password-error">
                        <span class="field-error" id="password-error"></span>
                    </div>
                    <div class="form-field">
                        <label for="confirm-password">Confirm password:</label>
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required aria-describedby="confirm-password-error">
                        <span class="field-error" id="confirm-password-error"></span>
                    </div>
                    <div class="form-field">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="1" max="120" step="1" required aria-describedby="age-error">
                        <span class="field-error" id="age-error"></span>
                    </div>
                    <div class="form-actions form-wide">
                        <button type="submit">Register</button>
                    </div>
                </div>
            </form>
            <p id="form-status" class="table-status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>
    <script>
        const form = document.querySelector("#registration-form");
        const fields = {
            name: document.querySelector("#name"),
            email: document.querySelector("#email"),
            password: document.querySelector("#password"),
            confirmPassword: document.querySelector("#confirm-password"),
            age: document.querySelector("#age")
        };
        const formStatus = document.querySelector("#form-status");
        let hasSubmitted = false;

        function getError(fieldName) {
            const value = fields[fieldName].value.trim();

            if (fieldName === "name" && !value) {
                return "Please enter your name.";
            }
            if (fieldName === "email" && !fields.email.validity.valid) {
                return "Please enter a valid email address.";
            }
            if (fieldName === "password" && fields.password.value.length < 8) {
                return "Password must be at least 8 characters.";
            }
            if (fieldName === "confirmPassword") {
                if (!fields.confirmPassword.value) {
                    return "Please confirm your password.";
                }
                if (fields.confirmPassword.value !== fields.password.value) {
                    return "Passwords do not match.";
                }
            }
            if (fieldName === "age" && (!value || !fields.age.validity.valid)) {
                return "Enter an age from 1 to 120.";
            }
            return "";
        }

        function updateField(fieldName) {
            const field = fields[fieldName];
            const error = getError(fieldName);
            document.querySelector(`#${field.id}-error`).textContent = error;
            field.setAttribute("aria-invalid", String(Boolean(error)));
            return !error;
        }

        Object.keys(fields).forEach((fieldName) => {
            fields[fieldName].addEventListener("input", () => {
                if (hasSubmitted) {
                    updateField(fieldName);
                    if (fieldName === "password" && fields.confirmPassword.value) {
                        updateField("confirmPassword");
                    }
                    formStatus.textContent = "";
                }
            });
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            hasSubmitted = true;
            const isValid = Object.keys(fields).map(updateField).every(Boolean);

            if (!isValid) {
                formStatus.textContent = "Please fix the errors above before registering.";
                const firstInvalidField = Object.values(fields).find((field) => field.getAttribute("aria-invalid") === "true");
                firstInvalidField.focus();
                return;
            }

            formStatus.textContent = "Registration details are valid. This demo does not send or store them.";
        });
    </script>
</body>
</html>
